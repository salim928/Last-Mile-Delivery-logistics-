version: '3.8'

services:
  # Backend API (Django)
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports: 
      - "8000:8000"
    environment: 
      - SECRET_KEY=django-insecure-your-super-secret-key-change-in-production-min-50
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://frontend:3000
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
      - backend_static:/app/staticfiles
    restart: unless-stopped

  # Frontend Dashboard
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports: 
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_uploads:
  backend_static: 